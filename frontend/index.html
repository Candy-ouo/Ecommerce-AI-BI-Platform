<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电商用户行为分析与 AI 智能 BI 平台</title>
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="js/lib/echarts.min.js"></script>
</head>
<body>
  <!-- 加载遮罩 -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载数据…</div>
  </div>
  <div class="dashboard">
    <header class="header">
      <h1>电商用户行为分析与 AI 智能 BI 平台</h1>
      <div class="header-meta">
        <span id="clock"></span>
        <span class="status-dot" id="status-dot" title="数据连接状态"></span>
      </div>
    </header>

    <section class="kpi-cards" id="kpi-cards"></section>

    <main class="main-area">
      <div class="card chart-card" id="module-01">
        <div class="card-title">日活跃用户趋势</div>
        <div id="chart-trend" class="chart"></div>
      </div>
      <div class="card chart-card" id="module-02">
        <div class="card-title">商品热度 Top5</div>
        <div class="mini-toggle" id="top-toggle">
          <button type="button" data-metric="pv" class="active">PV热度</button>
          <button type="button" data-metric="buy">购买热度</button>
        </div>
        <div id="chart-top" class="chart"></div>
      </div>
      <div class="card chart-card" id="module-03">
        <div class="card-title">转化漏斗</div>
        <div id="chart-funnel" class="chart"></div>
      </div>
      <div class="card chart-card" id="module-04">
        <div class="card-title">RFM 用户分布</div>
        <div id="chart-rfm" class="chart"></div>
      </div>
    </main>

    <aside class="side-panel" id="report-panel">
      <div class="card report-card" id="module-05">
        <div class="card-title">📰 AI 每日晨报</div>
        <div class="report-date" id="report-date"></div>
        <div class="report-summary" id="report-summary"></div>
        <div class="report-highlights" id="report-highlights"></div>
      </div>

      <div class="card recommend-card" id="module-06">
        <div class="card-title">🎯 个性化推荐</div>
        <div class="rec-user-input">
          <input type="text" id="rec-user-input" placeholder="输入用户ID" class="mini-select" value="98047837" />
          <button id="rec-refresh" class="mini-btn">刷新</button>
        </div>
        <div class="rec-user-label">当前用户：<span id="recommend-user">--</span> <span id="recommend-type-tag" class="rec-type-tag hot"></span></div>
        <div class="recommend-list" id="recommend-list"></div>
      </div>

      <div class="card report-history" id="module-07">
        <div class="card-title">📚 历史报告</div>
        <ul class="timeline" id="report-timeline"></ul>
      </div>
    </aside>
  </div>

  <nav class="bottom-nav">
    <button class="nav-menu-btn" id="nav-menu-btn">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-numbers" id="nav-numbers">
      <button class="nav-num-btn" data-module="01">1</button>
      <button class="nav-num-btn" data-module="02">2</button>
      <button class="nav-num-btn" data-module="03">3</button>
      <button class="nav-num-btn" data-module="04">4</button>
      <button class="nav-num-btn" data-module="05">5</button>
      <button class="nav-num-btn" data-module="06">6</button>
      <button class="nav-num-btn" data-module="07">7</button>
    </div>
  </nav>

  <div class="module-modal" id="module-modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <a href="chat.html" class="ai-float-btn" title="AI 智能助手">
    <div class="ai-avatar">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe6e6"/>
            <stop offset="100%" stop-color="#ffd1d9"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#faceGrad)"/>
        <ellipse cx="50" cy="55" rx="22" ry="18" fill="#ff9999" opacity="0.25"/>
        <circle cx="36" cy="46" r="5" fill="#4a3b3b"/>
        <circle cx="64" cy="46" r="5" fill="#4a3b3b"/>
        <path d="M42 64 Q50 70 58 64" stroke="#d66d8e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="30" cy="56" rx="5" ry="3" fill="#ff9eb5" opacity="0.6"/>
        <ellipse cx="70" cy="56" rx="5" ry="3" fill="#ff9eb5" opacity="0.6"/>
        <path d="M20 38 Q25 25 38 28" stroke="#6b4c4c" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M80 38 Q75 25 62 28" stroke="#6b4c4c" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="ai-float-pulse"></span>
  </a>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
